[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "latent-safety"
version = "0.1.0"
description = "Auditing safety information lost by learned latent representations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - license pending collaborator agreement" }
authors = [
  { name = "Latent Safety collaborators" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
research = [
  "ipykernel>=6.29",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "torchvision>=0.17",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "seaborn>=0.13",
]

[project.scripts]
latent-safety = "latent_safety.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/latent_safety"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
