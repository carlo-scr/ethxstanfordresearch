schema_version = 1
experiment = "e2_confirmatory_core_192"
status = "frozen_design_blocked_on_production_preconfirmation_gates"

[design]
inferential_unit = "paired training seed"
task_formula = "3 domains x 2 model families x 1 history mode x 4 arms x 8 fresh paired seeds"
pilot_seeds_excluded = [0, 1, 2]
final_test_access = "once after checkpoints, analysis code, failures, and exclusions are frozen"

[axes]
domains = [
  "controlled_cart_video",
  "controlled_pendulum_video",
  "controlled_dubins_navigation_pixels",
]
model_families = ["ae", "beta_vae"]
history_modes = ["stack_h4"]
arms = [
  "none",
  "h_prediction",
  "nonprivileged_predicted_action_profile",
  "fcsrl_feasibility_loss_adaptation",
]
seeds = [100, 101, 102, 103, 104, 105, 106, 107]

[execution]
expected_tasks = 192
output_root = "runs/e2_frontier/confirmatory_core_192"
device = "cuda"
third_domain_status = "implemented and CPU-smoked; GPU-scale preconfirmation and coverage-validation remain gated"

[loss_weight_freeze]
weights_are_task_axis = false
control_arm = "none"
control_regularization = "not_applicable"
learned_arm_weights = "validation-selected positive values frozen per declared stratum before these fresh-seed jobs"
tuning_config = "configs/e2_frontier/intervention.toml"
freeze_manifest = "runs/e2_frontier/preconfirmation_selected_weights.json"

[arm_semantics.none]
supervision = "none"
regularization = "not_applicable"
implementation_status = "implemented"

[arm_semantics.h_prediction]
supervision = "scalar safety-margin prediction"
profile_source = "not_applicable"
implementation_status = "implemented"

[arm_semantics.nonprivileged_predicted_action_profile]
supervision = "selected cross-fitted predicted constant-action profile"
uses_privileged_state_or_known_dynamics_for_training = false
oracle_profiles = "diagnostic only"
specification = "docs/predicted_profile_protocol.md"
implementation_status = "teacher training, five-shard assembly, observed-rollout coverage, downstream ingestion, and post-fit validation audit implemented and CPU-smoked; production gates unexecuted; confirmation blocked"

[arm_semantics.fcsrl_feasibility_loss_adaptation]
supervision = "offline same-backbone feasibility loss"
full_online_agent = false
categorical_head_hidden_dim = 64
specification = "docs/fcsrl_baseline_adaptation.md"
implementation_status = "EMA encoder, deterministic sequence loader, main-trainer checkpoint/resume, regression artifact, and post-fit validation audit implemented and CPU-smoked; production preconfirmation unexecuted; confirmation blocked"

[analysis]
selection_split = "validation"
primary_safety = "trajectory_balanced_p95_required_common_action_violation_at_frozen_radius"
primary_utility = "paired_none_normalized_reconstruction_and_rollout_ratios"
utility_noninferiority = "each utility ratio at most 1.05"
zero_control_error = "only zero learned error is eligible; define the zero-over-zero ratio as 1"
tie_break = "lowest primary safety endpoint, then lower maximum utility ratio, then smaller weight"
safety_selection_aggregate = "arithmetic mean across all three complete paired preconfirmation seeds"
reconstruction_ratio = "mean arm validation reconstruction MSE divided by mean paired-none validation reconstruction MSE"
rollout_ratio = "mean arm validation maximum-horizon rollout pixel MSE divided by mean paired-none validation rollout MSE"
primary_aggregate = "equal weight per domain-by-model-family stratum"
joint_success = "safety superiority and utility noninferiority in every domain"

[predicted_profile_teacher]
fold_count = 5
fold_assignment = "sort training trajectory IDs; shuffle with Python random.Random(20260822); assign shuffled index modulo 5"
training_scope = "teacher k trains only on training folds other than k"
architecture = "match downstream family; LatentWorldModel; stack_h4; latent_dim=8; hidden_dim=128; transition_hidden_dim=192"
objective = "h_prediction with safety_weight=0.5; otherwise inherit frozen domain base config"
teacher_seed_rule = "10000 + 10 * data_seed + fold_index"
epochs = 30
checkpoint_rule = "earliest epoch minimizing ordinary-validation world_model_utility within family"
inference = "eval mode; posterior mean; deterministic latent transition rollout"
label_rule = "held-out fold only; minimum predicted margin over t=0..H for each registered constant action"
privileged_training_inputs = false

[predicted_profile_validation]
split = "coverage_validation; disjoint from train, ordinary validation, calibration, and final test"
generator = "coverage_validation_observed_rollouts_v1"
coverage_seed_rule = "70000000 + domain_offset{cart:0,pendulum:100000,dubins:200000} + data_seed"
bundle_namespace = "coverage-{domain}-seed-{data_seed}-bundle-{index}"
history_length = 4
center_timestep = 3
branch_process_noise = 0.0
paired_initial_history_bundles_per_domain_seed = 200
reuse_bundle_ids_across_model_families = true
scenario_mix = "frozen deployment-generator mix"
branching = "clone every initial history and execute every registered action constantly for the domain horizon"
teacher_assignment = "sorted bundle index modulo 5; corresponding fold teacher; no ensemble"
target = "minimum observed h over t=0..H"
normalization = "divide bundle-wise maximum absolute action-profile error by frozen domain margin_scale"
quantile = "nearest-rank empirical p95: sorted_error[ceil(0.95*N)-1]"
required_max = 0.10
gate_scope = "every domain-family-data-seed cell"
preconfirmation_seeds = [0, 1, 2]
confirmation_seeds = [100, 101, 102, 103, 104, 105, 106, 107]
teachers_required_per_cell = 5
all_cells_and_teachers_required = true
on_any_confirmation_teacher_failure = "cancel confirmation before final-test access"
oracle_use = "controlled-domain true-dynamics profiles are diagnostic only"

[eligibility]
required_strata = "every required domain-family-data-seed validation cell"
max_relative_reconstruction_degradation = 0.05
max_relative_rollout_degradation = 0.05
minimum_eligible_center_coverage = 0.80
max_coverage_fraction_loss_vs_none = 0.05
eligible_center_coverage_denominator = "individually viable validation centers"
minimum_eligible_centers_per_trajectory = 1
neighborhood_mass_statistic = "median nonself neighborhood mass"
max_relative_neighborhood_mass_mismatch = 0.05
required_matched_mass_effect = "primary p95 improvement retains its sign"
matched_radius_freeze = "before final-test access"
predicted_profile_normalized_p95_error_max = 0.10

[fail_closed]
all_required_core_learned_arms_must_pass_all_required_cells = true
no_eligible_weight = "arm fails the stratum"
empty_trajectory_allowed = false
post_hoc_arm_substitution_allowed = false
any_confirmation_teacher_failure = "cancel confirmation before final-test access"
on_any_required_failure = "cancel or prospectively reframe before final-test access"

[inference]
proposed_arm = "nonprivileged_predicted_action_profile"
comparators = [
  "none",
  "h_prediction",
  "fcsrl_feasibility_loss_adaptation",
  "append_true_h_none_view",
]
domains = [
  "controlled_cart_video",
  "controlled_pendulum_video",
  "controlled_dubins_navigation_pixels",
]
endpoints = ["safety", "reconstruction", "rollout"]
elementary_bound_count = 36
elementary_bound_formula = "4 comparators x 3 domains x 3 endpoints"
model_family_aggregation = "within each seed and domain, average paired AE and beta-VAE differences equally"
paired_seeds = [100, 101, 102, 103, 104, 105, 106, 107]
paired_seed_count = 8
bootstrap_resamples = 100000
bootstrap_seed = 20260822
bootstrap_unit = "paired seed after equal AE/beta-VAE averaging within seed and domain"
confidence_sidedness = "one-sided upper"
family_alpha = 0.05
simultaneous_ucb_method = "Bonferroni over all 36 elementary bounds"
primary_ucb_method = "non-studentized percentile upper quantile"
primary_ucb_probability_formula = "1 - 0.05 / 36"
primary_ucb_quantile = 0.9986111111111111
studentized = false
bca = false
max_t = false
all_planned_runs_must_be_complete = true
all_elementary_bounds_must_pass = true

[inference.safety]
difference = "nonprivileged_predicted_action_profile - comparator"
contrast_count = 12
point_mean_max = -0.10
point_mean_operator = "less_than_or_equal"
ucb_max = 0.0
ucb_operator = "strictly_less_than"

[inference.utility]
relative_degradation = "(nonprivileged_predicted_action_profile - comparator) / comparator"
endpoints = ["reconstruction", "rollout"]
contrast_count = 24
ucb_max = 0.05
ucb_operator = "less_than_or_equal"
zero_denominator_rule = "only zero profile error is admissible; define tied zero relative degradation as 0"

[inference.secondary_sign_flip]
decision_role = "optional secondary only"
contrast_scope = "12 safety contrasts"
enabled_only_if = "paired method labels are exchangeable under a predeclared sharp null"
correction = "Holm"
family_alpha = 0.05
