schema_version = 2

[[claims]]
id = "T0-static-existence"
statement = "Among arbitrary latent subsets and for m at least zero, the complement of the encoded unsafe set is maximal sound, and closed/open m-completeness exists exactly when the conflicting safe-margin set avoids the corresponding closed/open upper ray."
status = "theorem_needs_proof"
scope = "included"
evidence = "Complete internal set-inclusion proof in docs/theory_v1.md, with the statement in paper/sections/theory_v1.tex and proof in paper/sections/theory_v1_appendix.tex; independent proof review pending."
tex_labels = ["thm:exact-existence"]

[[claims]]
id = "T1-static-frontier"
statement = "The infimum completeness margin of an arbitrary sound latent safe-set certificate equals the h-relative safe/unsafe fiber defect."
status = "theorem_needs_proof"
scope = "included"
evidence = "Complete internal proof draft in docs/theory_v1.md and paper/sections/theory_v1_appendix.tex; statement in paper/sections/theory_v1.tex; exhaustive finite regression checks in notebooks/02_theory_counterexamples.ipynb; independent proof review pending."
tex_labels = ["prop:threshold"]

[[claims]]
id = "T2-data-processing"
statement = "Deterministic post-processing of a representation cannot reduce the exact fiber defect."
status = "theorem_needs_proof"
scope = "included"
evidence = "Complete internal fiber-inclusion proof in docs/theory_v1.md and paper/sections/theory_v1_appendix.tex; statement in paper/sections/theory_v1.tex; 648 finite coarsening checks in notebooks/02_theory_counterexamples.ipynb; independent proof review pending."
tex_labels = ["thm:data-processing"]

[[claims]]
id = "T2b-stochastic-separation"
statement = "For a countable physical-state domain and arbitrary measurable stochastic-code space, an almost-surely sound closed or open margin-complete separator exists exactly when every required safe code law is mutually singular to every unsafe code law; the corresponding threshold has the deterministic endpoint rules, reduces to exact fibers for Dirac laws when measurable sets separate realized codes, and cannot improve under Markov-kernel post-processing."
status = "theorem_needs_proof"
scope = "included"
evidence = "Complete internal countable-union/intersection proof, Dirac reduction, total-variation data-processing argument, and uncountable-state counterexample in docs/theory_extensions_2026-08-22.md and paper/sections/theory_v1_appendix.tex; an independent internal proof audit passed, while external novelty review remains pending. The executed theory notebook checks 486 closed and 486 open finite certificate cases, 81 deterministic one-hot reductions, and 243 Markov post-processings."
tex_labels = ["thm:stochastic-separation"]

[[claims]]
id = "T2c-stochastic-tv-action"
statement = "For a safe-unsafe stochastic-code pair, minimum total separator error equals one minus total variation; for two states with disjoint measurable safe-action sets, every randomized latent policy has summed violation probability at least one minus code-law total variation, with a pointwise common-prior KL lower bound from Pinsker's inequality."
status = "theorem_needs_proof"
scope = "included"
evidence = "Complete internal testing-identity, Markov-kernel contraction, and action-event proofs, with an explicit application of classical Pinsker inequality, in docs/theory_extensions_2026-08-22.md and paper/sections/theory_v1_appendix.tex; an independent internal proof audit passed, while external novelty review remains pending. The executed theory notebook exhaustively checks 36 finite law pairs, 81 randomized-policy/disjoint-safe-action cases, 243 Markov post-processings, and a common-prior KL/Pinsker fixture using exact-rational kernel validation before guarded binary64 reporting."
tex_labels = ["prop:stochastic-tv"]

[[claims]]
id = "T3-action-conflict"
statement = "If inputs in one representation fiber are individually feasible under a declared action condition but have no common feasible action, no deterministic memoryless latent decision is uniformly feasible on that fiber."
status = "theorem_needs_proof"
scope = "included"
evidence = "Complete internal deterministic proof in docs/theory_v1.md and paper/sections/theory_v1_appendix.tex; finite-action audit, controlled hidden-velocity fixture, and unit tests; independent proof review pending."
tex_labels = ["thm:det-action"]

[[claims]]
id = "T3a-common-action-data-processing"
statement = "For a finite action library, real safety profile, and the representation-independent individually feasible set, deterministic post-processing of a representation cannot reduce the exact viable-state worst-fiber common-action violation."
status = "theorem_needs_proof"
scope = "included"
evidence = "Direct fiber-containment proof in paper/sections/theory_v1_appendix.tex; the result concerns exact fibers and does not assert monotonicity of an arbitrary finite-radius metric audit; independent proof review pending."
tex_labels = ["prop:action-data-processing"]

[[claims]]
id = "T3b-randomized-action-conflict"
statement = "Under the stated measurability hypotheses, strongly safe randomization exists exactly when the fiber has a common safe action; the same holds for pointwise almost-sure safety on countable fibers, or when actions form a compact metric space, the decision measure is Borel, and every safe-action set is closed."
status = "theorem_needs_proof"
scope = "included"
evidence = "Complete internal measure-theoretic proof draft and the uncountable nonclosed-set counterexample in docs/theory_v1.md and paper/sections/theory_v1_appendix.tex; independent proof review pending."
tex_labels = ["thm:rand-action"]

[[claims]]
id = "T3c-common-action-projection"
statement = "For a nonempty intersection of closed convex Euclidean safe-action sets, projection of a nominal action has a unique uniformly safe least-intervention solution and satisfies the projection variational inequality."
status = "theorem_needs_proof"
scope = "included"
evidence = "Complete internal finite-dimensional projection proof in docs/theory_v1.md and paper/sections/theory_v1_appendix.tex; measurable dependence across representation codes is explicitly not claimed; independent proof review pending."
tex_labels = ["thm:projection"]

[[claims]]
id = "T3d-helly-action-witness"
statement = "For nonempty closed-convex safe-action sets inside a compact convex actuator set U contained in R^p, common-action feasibility and the exact norm-relative minimax distance slack are determined by subfibers of at most p+1 states, sharpened to q+1 in affine dimension q; finite fibers admit an exact maximizing witness and the full-dimensional p+1 bound is sharp."
status = "theorem_needs_proof"
scope = "included"
evidence = "Classical-Helly-derived internal proof, affine-dimension refinement, compactness and endpoint qualifications, sharp simplex witness, and nonconvex/noncompact counterexamples in docs/theory_extensions_2026-08-22.md and paper/sections/theory_v1_appendix.tex; an independent internal proof audit passed, while external novelty review remains pending. The executed theory notebook checks 500 randomized interval families and the sharp planar witness."
tex_labels = ["thm:helly-action"]

[[claims]]
id = "T6-finite-action-slack"
statement = "For k finite actions, a nonempty representation fiber, and nonnegative violation loss with finite action-wise robust suprema, pointwise expected-loss minimax slack lies between one-over-k times and one times deterministic slack, while both action-wise robust expected loss and worst-supported-action loss equal deterministic slack."
status = "theorem_needs_proof"
scope = "included"
evidence = "Complete internal proof and finite-fiber LP dual in docs/theory_v1.md and paper/sections/theory_v1_appendix.tex; theorem statement in paper/sections/theory_v1.tex; independent proof review pending."
tex_labels = ["thm:finite-action"]

[[claims]]
id = "T4-average-loss-separation"
statement = "Vanishing expected reconstruction or prediction loss need not control a worst-case static or action fiber defect."
status = "theorem_needs_proof"
scope = "included"
evidence = "Explicit smooth compact-support construction, identity dynamics, and analytic O(delta) MSE bound in docs/theory_v1.md and paper/sections/theory_v1_appendix.tex; proposition statement in paper/sections/theory_v1.tex; executable regression tests in tests/test_average_loss_counterexample.py; independent proof review pending."
tex_labels = ["prop:average-separation"]

[[claims]]
id = "T5-cover-bound"
statement = "A uniform pair condition verified on an r-cover bounds robust static defect by 2 L_h r + kappa(delta + 2 L_E r), plus verification slack."
status = "theorem_needs_proof"
scope = "excluded"
evidence = "Corrected triangle-inequality calculation and reference implementation; covering assumptions pending."

[[claims]]
id = "T7-dynamic-policy-loss"
statement = "In an enumerated finite-horizon robust history game, the margin loss of any deterministic time-indexed code policy is bounded by its path-dependent selected-action regret buffer and by the corresponding sum of stagewise worst regrets."
status = "theorem_needs_proof"
scope = "excluded"
evidence = "Internal Bellman-induction draft in docs/theory_v2_dynamic.md and paper/sections/theory_v2_dynamic.tex, with exhaustive finite regression tests in tests/test_dynamic_theory.py; independent proof review pending and the result is not claimed as novel relative to approximate-information-state theory."

[[claims]]
id = "T8-dynamic-sign-preservation"
statement = "On a fully enumerated finite robust history game, the best worst-branch margin attainable from any nonempty same-layer history set obeys an exact set-valued representation Bellman recursion; stagewise representation refinement cannot reduce it, and zero recursive shortfall on every full-history-viable layer is equivalent to zero first-action obstruction and to one time-indexed code policy preserving every full-history-viable history."
status = "theorem_needs_proof"
scope = "excluded"
evidence = "Internal Bellman induction and policy-lift proofs in docs/theory_v2_dynamic.md and the excluded paper/sections/theory_v2_dynamic.tex; memoized finite oracle plus exhaustive policy-enumeration equivalence, random coarsening, strict split/merge, future-layer, union-coupling, and endpoint tests in tests/test_dynamic_theory.py; independent novelty review against approximate-information-state, symbolic-synthesis, and belief-support work remains pending."

