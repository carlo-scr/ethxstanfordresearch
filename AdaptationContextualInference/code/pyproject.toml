[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cira"
version = "0.1.0"
description = "Context-Indexed Residual Adapters: stage-1a MuJoCo puck-strike experiments"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.2",
  "numpy>=1.26",
  "torch>=2.2",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pillow>=10.1",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["ipykernel>=6.29", "ipywidgets>=8.1", "nbclient>=0.10", "nbformat>=5.10"]

[tool.hatch.build.targets.wheel]
packages = ["cira"]

[tool.pytest.ini_options]
testpaths = ["tests"]
